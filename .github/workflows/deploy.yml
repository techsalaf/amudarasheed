name: Deploy Laravel (Botble CMS) via LFTP

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 2  # Needed to detect changed files

      - name: Detect changed files
        id: changes
        run: |
          # Check if composer files changed
          if git diff --name-only HEAD~1 HEAD | grep -E "(composer\.(json|lock))"; then
            echo "composer_changed=true" >> $GITHUB_OUTPUT
          else
            echo "composer_changed=false" >> $GITHUB_OUTPUT
          fi
          
          # Check if package files changed
          if git diff --name-only HEAD~1 HEAD | grep -E "(package(-lock)?\.json|webpack\.mix\.js)"; then
            echo "assets_changed=true" >> $GITHUB_OUTPUT
          else
            echo "assets_changed=false" >> $GITHUB_OUTPUT
          fi
          
          # Check if migration files changed
          if git diff --name-only HEAD~1 HEAD | grep -E "database/migrations/"; then
            echo "migrations_changed=true" >> $GITHUB_OUTPUT
          else
            echo "migrations_changed=false" >> $GITHUB_OUTPUT
          fi

      - name: Setup PHP
        if: steps.changes.outputs.composer_changed == 'true' || steps.changes.outputs.migrations_changed == 'true'
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: gd, zip, curl
          tools: composer
          coverage: none

      - name: Install Composer dependencies (only if composer files changed)
        if: steps.changes.outputs.composer_changed == 'true'
        run: |
          composer install --no-dev --prefer-dist --no-interaction --no-progress

      - name: Publish CMS assets (only if composer changed)
        if: steps.changes.outputs.composer_changed == 'true'
        run: |
          php artisan cms:publish:assets

      - name: Setup Node.js
        if: steps.changes.outputs.assets_changed == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Node dependencies (only if package files changed)
        if: steps.changes.outputs.assets_changed == 'true'
        run: |
          npm ci

      - name: Build assets (only if assets changed)
        if: steps.changes.outputs.assets_changed == 'true'
        env:
          npm_config_theme: ''
          npm_config_plugin: ''
          npm_config_package: ''
          npm_config_core: ''
        run: |
          npm run production

      - name: Verify DNS and port connectivity
        env:
          FTP_HOST: ${{ secrets.FTP_HOST }}
          FTP_PORT: ${{ secrets.FTP_PORT }}
          FTP_HOST_IP: ${{ secrets.FTP_HOST_IP }}
          FTP_SFTP_PORT: ${{ secrets.FTP_SFTP_PORT }}
        id: conn
        run: |
          sudo apt-get update && sudo apt-get install -y dnsutils netcat-openbsd

          if [ -n "$FTP_HOST_IP" ]; then
            HOST="$FTP_HOST_IP"
            echo "Using provided IP for host: [redacted]"
          else
            HOST="$FTP_HOST"
            echo "Resolving $HOST" && nslookup "$HOST" || true
          fi

          # Try FTP port first; if closed, try SFTP
          if [ -n "$FTP_PORT" ] && nc -zv -w 7 "$HOST" "$FTP_PORT"; then
            PROTO="ftp"; PORT="$FTP_PORT";
            echo "Using FTP on $HOST:$PORT";
          elif nc -zv -w 7 "$HOST" "${FTP_SFTP_PORT:-22}"; then
            PROTO="sftp"; PORT="${FTP_SFTP_PORT:-22}";
            echo "Using SFTP on $HOST:$PORT";
          else
            echo "Neither FTP ($FTP_PORT) nor SFTP (${FTP_SFTP_PORT:-22}) reachable for $HOST";
            exit 1;
          fi

          echo "host=$HOST" >> "$GITHUB_OUTPUT"
          echo "proto=$PROTO" >> "$GITHUB_OUTPUT"
          echo "port=$PORT" >> "$GITHUB_OUTPUT"

      - name: 🚀 Deploy via LFTP (Sync Changed Files Only)
        run: |
          # Install lftp first
          sudo apt-get update && sudo apt-get install -y lftp
          
          # Get list of changed files since last commit
          CHANGED_FILES=$(git diff --name-only HEAD~1 HEAD)
          
          if [ -z "$CHANGED_FILES" ]; then
            echo "No files changed. Skipping FTP sync."
            exit 0
          fi

          # Build LFTP script with changed files only
          LFTP_SCRIPT=$(mktemp)
          echo "set ftp:ssl-force true;" >> "$LFTP_SCRIPT"
          echo "set ftp:ssl-protect-data true;" >> "$LFTP_SCRIPT"
          echo "set ftp:passive-mode yes;" >> "$LFTP_SCRIPT"
          echo "set net:timeout 30;" >> "$LFTP_SCRIPT"
          echo "set net:max-retries 3;" >> "$LFTP_SCRIPT"
          echo "set net:connection-limit 8;" >> "$LFTP_SCRIPT"
          echo "set ssl:verify-certificate no;" >> "$LFTP_SCRIPT"
          echo "set sftp:auto-confirm yes;" >> "$LFTP_SCRIPT"
          echo "set sftp:connect-program 'ssh -a -x -o StrictHostKeyChecking=no';" >> "$LFTP_SCRIPT"
          echo "open -u ${{ secrets.FTP_USERNAME }},${{ secrets.FTP_PASSWORD }} -p ${{ steps.conn.outputs.port }} ${{ steps.conn.outputs.proto }}://${{ steps.conn.outputs.host }};" >> "$LFTP_SCRIPT"

          echo "Uploading changed files:"
          while IFS= read -r FILE; do
            # Skip if file doesn't exist locally (was deleted)
            if [ ! -f "$FILE" ]; then
              echo "  [DELETE] $FILE"
              echo "rm '$FILE';" >> "$LFTP_SCRIPT"
              continue
            fi
            
            # Skip excluded files
            if echo "$FILE" | grep -E '(^\.git/|^\.github/|^node_modules/|^tests/|^storage/logs/|^storage/debugbar/|^\.env)' > /dev/null; then
              continue
            fi
            
            echo "  [UPLOAD] $FILE"
            echo "put '$FILE' -o '$FILE';" >> "$LFTP_SCRIPT"
          done <<< "$CHANGED_FILES"

          echo "quit;" >> "$LFTP_SCRIPT"

          # Execute LFTP script
          echo "Executing FTP sync..."
          lftp -f "$LFTP_SCRIPT"
          rm "$LFTP_SCRIPT"

      - name: Decide migration strategy
        if: steps.changes.outputs.migrations_changed == 'true'
        id: migration_gate
        run: |
          if [ "${{ steps.conn.outputs.proto }}" != "sftp" ]; then
            echo "run_migrations=false" >> "$GITHUB_OUTPUT"
            echo "Skipping migrations: SSH/SFTP is not selected for this server connection."
          else
            echo "run_migrations=true" >> "$GITHUB_OUTPUT"
            echo "Migrations are enabled via SSH on ${{ steps.conn.outputs.host }}:${{ steps.conn.outputs.port }}"
          fi

      - name: 🔄 Run migrations (best effort)
        if: steps.changes.outputs.migrations_changed == 'true' && steps.migration_gate.outputs.run_migrations == 'true'
        continue-on-error: true
        run: |
          ssh -o StrictHostKeyChecking=no -o ConnectTimeout=20 -p "${{ steps.conn.outputs.port }}" "${{ secrets.FTP_USERNAME }}@${{ steps.conn.outputs.host }}" "cd '${{ secrets.FTP_REMOTE_PATH }}' && php artisan migrate --force"
