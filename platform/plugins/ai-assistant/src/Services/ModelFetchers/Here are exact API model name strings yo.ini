Here are exact API model name strings you can use for OpenAI, Claude (Anthropic), Grok (xAI), DeepSeek, and Gemini (Google) in your application. These are the identifiers developers use in API calls (e.g., with Python/JS clients or REST calls) as of early 2026.

🧠 OpenAI API Model Names

OpenAI’s latest flagship generation is GPT-5.2 with multiple flavors:

Main GPT-5.2 Models (recommended)

gpt-5.2-chat-latest — GPT-5.2 Instant (fast, general purpose)

gpt-5.2 — GPT-5.2 Thinking (default deep reasoning)

gpt-5.2-pro — GPT-5.2 Pro (highest-quality, slower)

❗ Optional/Open-weight (may vary by platform)

gpt-5-1-chat-latest — GPT-5.1 Chat (older but still supported)

gpt-5-1 — GPT-5.1 (reasoning)

gpt-5-2-codex — GPT-5.2 optimized for coding/agents (if available)

🫧 Anthropic / Claude API Model Names

Anthropic model IDs are versioned strings typically including the model name and date stamp. The most current ones include Opus and Sonnet:

Current Claude Models

claude-opus-4-1-20250805 — Claude Opus 4.1 (top performing)

claude-opus-4-20250514 — Claude Opus 4.0 (slightly older)

claude-sonnet-4-20250514 — Claude Sonnet 4.0 (balanced)

🧠 Note: You can query /v1/models from Anthropic to list available IDs (they change over time).

🚀 Grok (xAI) API Model Names

Grok model strings are generally shorter “grok-…” identifiers (common in unified API services). Typical ones include:

Grok Models

grok-4-1-fast-non-reasoning — Grok 4.1 standard fast model

grok-4-1-fast-reasoning — Grok 4.1 reasoning variant

grok-4 — Grok 4 baseline

grok-4-fast — Fast Grok 4 variant

grok-3 / grok-3-mini — Older/smaller variants (optional fallbacks)

Model naming for Grok can vary by API provider, so use exact versions returned from the service’s list_models endpoint.

🔍 DeepSeek API Model Names

DeepSeek’s official API supports a few main models focused on chat and reasoning:

DeepSeek Models

deepseek-v3-2 — DeepSeek V3.2 (general, reasoning)

deepseek-v3-2-speciale — DeepSeek V3.2 Speciale (enhanced reasoning)

Some integrations also offer:

deepseek-chat — chat-optimized baseline

deepseek-reasoner — deep reasoning variant
These may appear in wrapper APIs or catalogs but check the official DeepSeek API’s GET /models to confirm current strings.

🌐 Gemini (Google/Vertex AI) API Model Names

Google’s Gemini models are named with version and tier. Common ones as of late 2025–2026 include:

Gemini Models

gemini-3-pro-preview — Gemini 3 Pro (preview / advanced)

gemini-3-flash-preview — Gemini 3 Flash (fast)

gemini-2.5-pro — Gemini 2.5 Pro (production)

gemini-2.5-flash — Gemini 2.5 Flash (fast/efficient)

gemini-1.5-pro-latest — Gemini 1.5 Pro (legacy support)

REST API Usage Note: In Google’s GenAI REST API, model resources are typically referenced in full form as:

models/{model_id}


(e.g., models/gemini-3-pro-preview).

🛠️ How to Fetch Exact Models Programmatically

To make your application dynamically adapt as models evolve:

OpenAI
curl https://api.openai.com/v1/models \
  -H "Authorization: Bearer $OPENAI_API_KEY"


then filter by provider.

Anthropic
curl https://api.anthropic.com/v1/models \
  -H "x-api-key: $ANTHROPIC_API_KEY"


returns live model IDs.

Google (Gemini)

Use the GenAI API’s models.list() endpoint to list all available Gemini models.

DeepSeek

Call GET /models on DeepSeek’s API to get current model strings.

